<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIM-GUDANG & KESEHATAN - Sistem Inventaris Terpadu</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN for inline JSX transformation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase: sinkronisasi data bersama secara realtime -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom scrollbar for desktop preview */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper component for rendering Lucide SVG icons safely
    const Icon = ({ name, className = "w-5 h-5", ...props }) => {
      const [svgContent, setSvgContent] = useState('');

      useEffect(() => {
        if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
          const iconSvg = window.lucide.createIcons({
            icons: { [name]: window.lucide.icons[name] },
            nameAttr: 'data-lucide'
          });
        }
      }, [name]);

      // Fallback SVG rendering logic using lucide DOM elements
      return (
        <i data-lucide={name} className={className} {...props}></i>
      );
    };

    // ==========================================
    // MOCK DATA AWAL (INITIAL STATE)
    // ==========================================
    const INITIAL_ITEMS = [
      { id: 'ITM-001', name: 'Proyektor Epson EB-X400', category: 'Elektronik', brand: 'Epson', condition: 'Baik', stock: 5, canBorrow: true, location: 'Gudang Utama - Rak A1' },
      { id: 'ITM-002', name: 'Laptop Dell Latitude 3420', category: 'Elektronik', brand: 'Dell', condition: 'Baik', stock: 12, canBorrow: true, location: 'Ruang IT - Lemari 2' },
      { id: 'ITM-003', name: 'Kursi Lipat Chitose', category: 'Mebel', brand: 'Chitose', condition: 'Baik', stock: 45, canBorrow: true, location: 'Gudang B - Sektor 3' },
      { id: 'ITM-004', name: 'Kamera DSLR Canon EOS 80D', category: 'Elektronik', brand: 'Canon', condition: 'Rusak Ringan', stock: 2, canBorrow: false, location: 'Studio Foto' },
      { id: 'ITM-005', name: 'Sound System Portable Baretone', category: 'Elektronik', brand: 'Baretone', condition: 'Baik', stock: 3, canBorrow: true, location: 'Gudang Utama - Rak C2' },
      { id: 'ITM-006', name: 'Papan Tulis Whiteboard 120x240', category: 'Peralatan', brand: 'Sakana', condition: 'Baik', stock: 8, canBorrow: true, location: 'Gudang B - Sektor 1' },
      { id: 'ITM-007', name: 'Genset Honda 3000 Watt', category: 'Peralatan', brand: 'Honda', condition: 'Rusak Berat', stock: 1, canBorrow: false, location: 'Bengkel Servis' },
    ];

    const INITIAL_MEDICINES = [
      { id: 'MED-001', name: 'Paracetamol 500mg', type: 'Tablet', brand: 'Kimia Farma', dosage: '500 mg', stock: 150, expiryDate: '2027-05-20', condition: 'Baik', location: 'Lemari Obat A - Rak 1' },
      { id: 'MED-002', name: 'Amoxicillin 500mg', type: 'Tablet', brand: 'Kalbe', dosage: '500 mg', stock: 4, expiryDate: '2026-11-25', condition: 'Baik', location: 'Lemari Obat A - Rak 2' },
      { id: 'MED-003', name: 'Batuk Sirup OBH Combi', type: 'Sirup', brand: 'Combiphar', dosage: '100 ml', stock: 18, expiryDate: '2026-11-15', condition: 'Baik', location: 'Lemari Obat B - Shelf Top' },
      { id: 'MED-004', name: 'Betadine Antiseptik Solution', type: 'Salep/Cair', brand: 'Mahakam', dosage: '60 ml', stock: 25, expiryDate: '2028-01-10', condition: 'Baik', location: 'Kotak P3K Utama' },
      { id: 'MED-005', name: 'Tensimeter Digital Omron', type: 'Alat Medis', brand: 'Omron', dosage: '1 Unit', stock: 3, expiryDate: '2030-12-31', condition: 'Baik', location: 'Kotak Alkes C' },
      { id: 'MED-006', name: 'Salep Bioplacenton 15g', type: 'Salep/Cair', brand: 'Kalbe', dosage: '15 gram', stock: 2, expiryDate: '2026-10-01', condition: 'Expired', location: 'Kotak P3K 2' },
      { id: 'MED-007', name: 'Kain Kasa Steril 16x16', type: 'Alat Medis', brand: 'Husada', dosage: 'Box isi 10', stock: 40, expiryDate: '2029-08-15', condition: 'Baik', location: 'Lemari B - Alkes' },
    ];

    const INITIAL_TRANSACTIONS = [
      { id: 'TRX-1001', date: '2026-10-28 09:30', itemType: 'Umum', itemName: 'Proyektor Epson EB-X400', type: 'Peminjaman', quantity: 1, handler: 'Budi Santoso', contact: '0812-3456-7890', returnPlan: '2026-11-01', status: 'Dipinjam', notes: 'Untuk Acara Seminar Kampus' },
      { id: 'TRX-1002', date: '2026-10-29 14:15', itemType: 'Kesehatan', itemName: 'Paracetamol 500mg', type: 'Distribusi Obat', quantity: 10, handler: 'Siti Aminah', contact: '-', returnPlan: '-', status: 'Selesai', notes: 'Keluhan Demam & Pusing Karyawan' },
      { id: 'TRX-1003', date: '2026-10-30 11:00', itemType: 'Umum', itemName: 'Kursi Lipat Chitose', type: 'Barang Masuk', quantity: 20, handler: 'Admin Gudang', contact: '-', returnPlan: '-', status: 'Selesai', notes: 'Pengadaan Baru APBD 2026' },
      { id: 'TRX-1004', date: '2026-10-31 16:45', itemType: 'Kesehatan', itemName: 'Betadine Antiseptik Solution', type: 'Distribusi Obat', quantity: 2, handler: 'Rudi Hermawan', contact: '-', returnPlan: '-', status: 'Selesai', notes: 'P3K Pertolongan Pertama Lapangan' },
      { id: 'TRX-1005', date: '2026-11-01 10:20', itemType: 'Umum', itemName: 'Laptop Dell Latitude 3420', type: 'Peminjaman', quantity: 2, handler: 'Dewi Lestari', contact: '0857-9988-7766', returnPlan: '2026-11-05', status: 'Dipinjam', notes: 'Kegiatan Audit Lapangan' },
    ];

    // Helper: Hitung sisa hari menuju expired
    const getDaysToExpiry = (expiryDateStr) => {
      if (!expiryDateStr) return 9999;
      const today = new Date('2026-11-02');
      const exp = new Date(expiryDateStr);
      const diffTime = exp.getTime() - today.getTime();
      return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    };

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Data aplikasi disimpan di Cloud Firestore agar semua perangkat melihat data yang sama.
      const [items, setItems] = useState(INITIAL_ITEMS);
      const [medicines, setMedicines] = useState(INITIAL_MEDICINES);
      const [transactions, setTransactions] = useState(INITIAL_TRANSACTIONS);
      const [cloudStatus, setCloudStatus] = useState('Menghubungkan ke database...');
      const [cloudReady, setCloudReady] = useState(false);
      const [cloudError, setCloudError] = useState('');
      const lastCloudData = useRef('');

      // Konfigurasi Firebase diisi setelah membuat project Firebase (lihat PANDUAN.txt).
      const firebaseConfig = {
        apiKey: "ISI_API_KEY",
        authDomain: "ISI_PROJECT_ID.firebaseapp.com",
        projectId: "ISI_PROJECT_ID",
        appId: "ISI_APP_ID"
      };

      const firebaseConfigured = firebaseConfig.apiKey !== 'ISI_API_KEY' &&
        firebaseConfig.projectId !== 'ISI_PROJECT_ID' && firebaseConfig.appId !== 'ISI_APP_ID';

      useEffect(() => {
        if (!firebaseConfigured) {
          setCloudStatus('Belum dikonfigurasi');
          setCloudError('Website perlu dihubungkan ke Firebase terlebih dahulu. Ikuti PANDUAN.txt.');
          return;
        }

        let unsubscribe = null;
        let cancelled = false;
        const startCloud = async () => {
          try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const db = firebase.firestore();
            await auth.signInAnonymously();
            if (cancelled) return;
            const ref = db.collection('sharedInventory').doc('main');
            const snapshot = await ref.get();
            if (!snapshot.exists) {
              await ref.set({
                items: INITIAL_ITEMS,
                medicines: INITIAL_MEDICINES,
                transactions: INITIAL_TRANSACTIONS,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            }
            if (cancelled) return;
            unsubscribe = ref.onSnapshot((doc) => {
              if (!doc.exists) return;
              const data = doc.data();
              lastCloudData.current = JSON.stringify({ items: data.items || [], medicines: data.medicines || [], transactions: data.transactions || [] });
              if (Array.isArray(data.items)) setItems(data.items);
              if (Array.isArray(data.medicines)) setMedicines(data.medicines);
              if (Array.isArray(data.transactions)) setTransactions(data.transactions);
              setCloudReady(true);
              setCloudStatus('Terhubung · Data bersama aktif');
              setCloudError('');
            }, (error) => {
              console.error(error);
              setCloudStatus('Gagal membaca database');
              setCloudError(error.message || 'Periksa konfigurasi dan aturan Firebase.');
            });
          } catch (error) {
            console.error(error);
            setCloudStatus('Koneksi gagal');
            setCloudError(error.message || 'Periksa koneksi internet dan pengaturan Firebase.');
          }
        };
        startCloud();
        return () => { cancelled = true; if (unsubscribe) unsubscribe(); };
      }, []);

      // Simpan perubahan ke satu dokumen cloud. Semua pengguna menerima pembaruan realtime.
      useEffect(() => {
        if (!cloudReady || !firebaseConfigured || !firebase.apps.length) return;
        const currentData = JSON.stringify({ items, medicines, transactions });
        if (currentData === lastCloudData.current) return;
        lastCloudData.current = currentData;
        const save = async () => {
          try {
            await firebase.firestore().collection('sharedInventory').doc('main').set({
              items, medicines, transactions,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            setCloudStatus('Tersimpan · Data bersama aktif');
            setCloudError('');
          } catch (error) {
            console.error(error);
            setCloudStatus('Gagal menyimpan');
            setCloudError(error.message || 'Perubahan belum tersimpan ke cloud.');
          }
        };
        save();
      }, [items, medicines, transactions, cloudReady]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab, items, medicines, transactions, mobileMenuOpen]);

      // Modal States
      const [isAddItemModalOpen, setIsAddItemModalOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);

      const [isAddMedModalOpen, setIsAddMedModalOpen] = useState(false);
      const [editingMed, setEditingMed] = useState(null);

      const [isBorrowModalOpen, setIsBorrowModalOpen] = useState(false);
      const [selectedBorrowItem, setSelectedBorrowItem] = useState(null);

      const [isDistributeMedModalOpen, setIsDistributeMedModalOpen] = useState(false);
      const [selectedDistributeMed, setSelectedDistributeMed] = useState(null);

      // Search & Filter State
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('All');
      const [filterCondition, setFilterCondition] = useState('All');

      // Stats Calculations
      const stats = useMemo(() => {
        const totalItems = items.reduce((acc, curr) => acc + Number(curr.stock), 0);
        const damagedItems = items.filter(i => i.condition !== 'Baik').length;
        const totalMeds = medicines.reduce((acc, curr) => acc + Number(curr.stock), 0);
        
        const alertMeds = medicines.filter(m => {
          const days = getDaysToExpiry(m.expiryDate);
          return Number(m.stock) <= 5 || days <= 30 || m.condition === 'Expired';
        }).length;

        const activeBorrows = transactions.filter(t => t.status === 'Dipinjam').length;

        return { totalItems, damagedItems, totalMeds, alertMeds, activeBorrows };
      }, [items, medicines, transactions]);

      const handleDeleteItem = (id) => {
        if (window.confirm('Apakah Anda yakin ingin menghapus barang ini?')) {
          setItems(prev => prev.filter(item => item.id !== id));
        }
      };

      const handleDeleteMed = (id) => {
        if (window.confirm('Apakah Anda yakin ingin menghapus data obat ini?')) {
          setMedicines(prev => prev.filter(med => med.id !== id));
        }
      };

      const handleReturnItem = (transactionId, itemName, qty) => {
        if (window.confirm(`Konfirmasi pengembalian barang: ${itemName}?`)) {
          setTransactions(prev => prev.map(t => t.id === transactionId ? { ...t, status: 'Dikembalikan' } : t));
          
          setItems(prev => prev.map(item => {
            if (item.name === itemName) {
              return { ...item, stock: Number(item.stock) + Number(qty) };
            }
            return item;
          }));

          const newLog = {
            id: `TRX-${Math.floor(1000 + Math.random() * 9000)}`,
            date: new Date().toISOString().replace('T', ' ').substring(0, 16),
            itemType: 'Umum',
            itemName: itemName,
            type: 'Pengembalian',
            quantity: qty,
            handler: 'System Admin',
            contact: '-',
            returnPlan: '-',
            status: 'Selesai',
            notes: `Pengembalian sukses dari transaksi #${transactionId}`
          };
          setTransactions(prev => [newLog, ...prev]);
        }
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          
          {/* HEADER / NAVIGATION BAR */}
          <header className="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                
                {/* Logo & Brand */}
                <div className="flex items-center space-x-3">
                  <div className="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2 rounded-xl text-white shadow-lg">
                    <Icon name="building-2" className="w-6 h-6" />
                  </div>
                  <div>
                    <span className="font-bold text-base sm:text-lg tracking-tight block leading-tight text-white">SIM-GUDANG & KESEHATAN</span>
                    <span className="text-[11px] sm:text-xs text-slate-400 font-medium">Sistem Inventaris Terpadu Organisasi</span>
                  </div>
                </div>

                {/* Desktop Navigation Links */}
                <nav className="hidden md:flex space-x-1">
                  <button
                    onClick={() => setActiveTab('dashboard')}
                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 ${
                      activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <Icon name="layout-dashboard" className="w-4 h-4" />
                    <span>Dashboard</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('items')}
                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 ${
                      activeTab === 'items' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <Icon name="package" className="w-4 h-4" />
                    <span>Barang Umum</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('medicines')}
                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 relative ${
                      activeTab === 'medicines' ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <Icon name="pill" className="w-4 h-4" />
                    <span>Modul Kesehatan</span>
                    {stats.alertMeds > 0 && (
                      <span className="ml-1.5 bg-amber-500 text-slate-900 text-xs font-extrabold px-1.5 py-0.5 rounded-full">
                        {stats.alertMeds}
                      </span>
                    )}
                  </button>

                  <button
                    onClick={() => setActiveTab('logs')}
                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 ${
                      activeTab === 'logs' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <Icon name="history" className="w-4 h-4" />
                    <span>Riwayat Log</span>
                  </button>

                  <button
                    onClick={() => setActiveTab('database')}
                    className={`px-3 py-2 rounded-lg text-sm font-medium transition-all flex items-center space-x-2 ${
                      activeTab === 'database' ? 'bg-purple-600 text-white shadow-sm' : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                  >
                    <Icon name="database" className="w-4 h-4" />
                    <span>Skema Database</span>
                  </button>
                </nav>

                {/* Mobile menu button */}
                <div className="flex md:hidden">
                  <button
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    className="p-2 rounded-md text-slate-400 hover:text-white hover:bg-slate-800 focus:outline-none"
                  >
                    <Icon name={mobileMenuOpen ? "x" : "menu"} className="w-6 h-6" />
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Navigation Dropdown */}
            {mobileMenuOpen && (
              <div className="md:hidden bg-slate-800 border-t border-slate-700 px-2 pt-2 pb-3 space-y-1">
                <button
                  onClick={() => { setActiveTab('dashboard'); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-md text-base font-medium flex items-center space-x-3 ${
                    activeTab === 'dashboard' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <Icon name="layout-dashboard" className="w-5 h-5" />
                  <span>Dashboard</span>
                </button>
                <button
                  onClick={() => { setActiveTab('items'); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-md text-base font-medium flex items-center space-x-3 ${
                    activeTab === 'items' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <Icon name="package" className="w-5 h-5" />
                  <span>Barang Umum</span>
                </button>
                <button
                  onClick={() => { setActiveTab('medicines'); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-md text-base font-medium flex items-center space-x-3 ${
                    activeTab === 'medicines' ? 'bg-emerald-600 text-white' : 'text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <Icon name="pill" className="w-5 h-5" />
                  <span>Modul Kesehatan</span>
                  {stats.alertMeds > 0 && (
                    <span className="bg-amber-500 text-slate-900 text-xs font-bold px-2 py-0.5 rounded-full ml-auto">
                      {stats.alertMeds}
                    </span>
                  )}
                </button>
                <button
                  onClick={() => { setActiveTab('logs'); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-md text-base font-medium flex items-center space-x-3 ${
                    activeTab === 'logs' ? 'bg-blue-600 text-white' : 'text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <Icon name="history" className="w-5 h-5" />
                  <span>Riwayat Transaksi Log</span>
                </button>
                <button
                  onClick={() => { setActiveTab('database'); setMobileMenuOpen(false); }}
                  className={`w-full text-left px-3 py-2.5 rounded-md text-base font-medium flex items-center space-x-3 ${
                    activeTab === 'database' ? 'bg-purple-600 text-white' : 'text-slate-300 hover:bg-slate-700'
                  }`}
                >
                  <Icon name="database" className="w-5 h-5" />
                  <span>Perancangan Database</span>
                </button>
              </div>
            )}
          </header>

          {/* MAIN CONTAINER CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
            <div className={`mb-4 rounded-xl border px-4 py-3 text-xs sm:text-sm ${cloudReady ? 'border-emerald-200 bg-emerald-50 text-emerald-800' : 'border-amber-200 bg-amber-50 text-amber-800'}`}>
              <div className="font-bold">Status database: {cloudStatus}</div>
              {cloudError && <div className="mt-1">{cloudError}</div>}
              {cloudReady && <div className="mt-1">Perubahan akan dibagikan ke perangkat lain yang membuka website ini.</div>}
            </div>

            {/* TAB 1: DASHBOARD */}
            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                  <div>
                    <h1 className="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight">Dashboard & Ringkasan Inventaris</h1>
                    <p className="text-slate-500 text-xs sm:text-sm">Monitoring real-time stok barang umum, obat-obatan, dan status peminjaman.</p>
                  </div>
                  <div className="flex items-center space-x-2">
                    <button 
                      onClick={() => {
                        if (window.confirm('Reset data inventaris ke data bawaan awal?')) {
                          setItems(INITIAL_ITEMS);
                          setMedicines(INITIAL_MEDICINES);
                          setTransactions(INITIAL_TRANSACTIONS);
                        }
                      }}
                      className="px-3 py-2 text-xs font-semibold bg-slate-200 text-slate-700 hover:bg-slate-300 rounded-lg flex items-center space-x-1 transition"
                    >
                      <Icon name="refresh-cw" className="w-3.5 h-3.5" />
                      <span>Reset Demo Data</span>
                    </button>
                  </div>
                </div>

                {/* Stat Summary Cards Grid */}
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-white rounded-xl p-5 border border-slate-200 shadow-sm hover:shadow-md transition">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-slate-400 uppercase tracking-wider">Total Barang Umum</span>
                      <div className="p-2 bg-blue-50 text-blue-600 rounded-lg">
                        <Icon name="package" className="w-5 h-5" />
                      </div>
                    </div>

                    value={formData.type}
                    onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white"
                  >
                    <option value="Tablet">Tablet</option>
                    <option value="Sirup">Sirup</option>
                    <option value="Salep/Cair">Salep / Cair</option>
                    <option value="Alat Medis">Alat Medis</option>
                  </select>
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Dosis / Ukuran</label>
                  <input
                    type="text"
                    value={formData.dosage}
                    onChange={(e) => setFormData({ ...formData, dosage: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                    placeholder="Contoh: 500 mg / 100 ml"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Pabrik / Merk</label>
                  <input
                    type="text"
                    value={formData.brand}
                    onChange={(e) => setFormData({ ...formData, brand: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                    placeholder="Contoh: Kimia Farma"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Jumlah Stok *</label>
                  <input
                    type="number"
                    min="0"
                    required
                    value={formData.stock}
                    onChange={(e) => setFormData({ ...formData, stock: Number(e.target.value) })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                  />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Tanggal Expired *</label>
                  <input
                    type="date"
                    required
                    value={formData.expiryDate}
                    onChange={(e) => setFormData({ ...formData, expiryDate: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Kondisi Obat *</label>
                  <select
                    value={formData.condition}
                    onChange={(e) => setFormData({ ...formData, condition: e.target.value })}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white"
                  >
                    <option value="Baik">Baik</option>
                    <option value="Rusak">Rusak</option>
                    <option value="Expired">Expired</option>
                  </select>
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Lokasi Penyimpanan *</label>
                <input
                  type="text"
                  required
                  value={formData.location}
                  onChange={(e) => setFormData({ ...formData, location: e.target.value })}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                  placeholder="Contoh: Lemari Obat A - Rak 2"
                />
              </div>

              <div className="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg font-semibold hover:bg-slate-50"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold shadow-sm"
                >
                  Simpan Obat
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function BorrowModal({ item, onClose, onConfirm }) {
      const [borrowerName, setBorrowerName] = useState('');
      const [borrowerContact, setBorrowerContact] = useState('');
      const [quantity, setQuantity] = useState(1);
      const [returnPlan, setReturnPlan] = useState('2026-11-05');
      const [notes, setNotes] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (quantity > item.stock) {
          alert(`Jumlah pinjam (${quantity}) melebihi stok yang ada (${item.stock})!`);
          return;
        }
        onConfirm({ borrowerName, borrowerContact, quantity, returnPlan, notes });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-100">
            <div className="bg-slate-900 px-6 py-4 flex items-center justify-between text-white">
              <h3 className="font-bold text-base flex items-center space-x-2">
                <Icon name="user-check" className="w-5 h-5 text-indigo-400" />
                <span>Form Peminjaman Barang</span>
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 text-xs sm:text-sm">
              <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                <span className="text-xs text-slate-500 font-semibold block">Barang Dipinjam:</span>
                <span className="font-bold text-slate-800 text-base">{item.name}</span>
                <span className="text-xs text-slate-500 block">Stok Tersedia: <strong>{item.stock}</strong> unit</span>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Nama Peminjam *</label>
                <input
                  type="text"
                  required
                  value={borrowerName}
                  onChange={(e) => setBorrowerName(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                  placeholder="Contoh: Budi Santoso"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">No. HP / Kontak *</label>
                  <input
                    type="text"
                    required
                    value={borrowerContact}
                    onChange={(e) => setBorrowerContact(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                    placeholder="0812-xxxx-xxxx"
                  />
                </div>
                <div>
                  <label className="block font-semibold text-slate-700 mb-1">Jumlah Pinjam *</label>
                  <input
                    type="number"
                    min="1"
                    max={item.stock}
                    required
                    value={quantity}
                    onChange={(e) => setQuantity(e.target.value)}
                    className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                  />
                </div>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Rencana Tanggal Kembali *</label>
                <input
                  type="date"
                  required
                  value={returnPlan}
                  onChange={(e) => setReturnPlan(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Keperluan / Catatan</label>
                <textarea
                  rows="2"
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                  placeholder="Contoh: Untuk seminar divisi IT"
                ></textarea>
              </div>

              <div className="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg font-semibold hover:bg-slate-50"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold shadow-sm"
                >
                  Konfirmasi Peminjaman
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function DistributeMedModal({ med, onClose, onConfirm }) {
      const [recipientName, setRecipientName] = useState('');
      const [quantity, setQuantity] = useState(1);
      const [symptoms, setSymptoms] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (quantity > med.stock) {
          alert(`Jumlah pemberian (${quantity}) melebihi stok obat (${med.stock})!`);
          return;
        }
        onConfirm({ recipientName, quantity, symptoms });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
          <div className="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-100">
            <div className="bg-slate-900 px-6 py-4 flex items-center justify-between text-white">
              <h3 className="font-bold text-base flex items-center space-x-2">
                <Icon name="pill" className="w-5 h-5 text-emerald-400" />
                <span>Pencatatan Distribusi Obat / P3K</span>
              </h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>
            <form onSubmit={handleSubmit} className="p-6 space-y-4 text-xs sm:text-sm">
              <div className="p-3 bg-emerald-50 rounded-lg border border-emerald-200">
                <span className="text-xs text-emerald-700 font-semibold block">Obat / Alkes Diberikan:</span>
                <span className="font-bold text-slate-800 text-base">{med.name}</span>
                <span className="text-xs text-slate-600 block">Stok Tersedia: <strong>{med.stock}</strong> ({med.dosage})</span>
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Diberikan Ke (Nama Penerima/Pasien) *</label>
                <input
                  type="text"
                  required
                  value={recipientName}
                  onChange={(e) => setRecipientName(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                  placeholder="Contoh: Siti Aminah (Staf HR)"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Jumlah Diberikan *</label>
                <input
                  type="number"
                  min="1"
                  max={med.stock}
                  required
                  value={quantity}
                  onChange={(e) => setQuantity(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                />
              </div>

              <div>
                <label className="block font-semibold text-slate-700 mb-1">Keperluan / Keluhan Sakit *</label>
                <textarea
                  rows="2"
                  required
                  value={symptoms}
                  onChange={(e) => setSymptoms(e.target.value)}
                  className="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none"
                  placeholder="Contoh: Pusing kepala & pertolongan pertama P3K"
                ></textarea>
              </div>

              <div className="flex justify-end space-x-2 pt-4 border-t border-slate-100">
                <button
                  type="button"
                  onClick={onClose}
                  className="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg font-semibold hover:bg-slate-50"
                >
                  Batal
                </button>
                <button
                  type="submit"
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-semibold shadow-sm"
                >
                  Simpan Log Distribusi
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Render React App to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
